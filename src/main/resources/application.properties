spring.application.name=wallet_service

# 8080 is commonly taken by other local services; override with PORT if needed.
server.port=${PORT:8081}

# Local/dev H2 only - target DB is Postgres per README.
spring.datasource.url=jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always

# logging
logging.file.name=logs/wallet-service.log
